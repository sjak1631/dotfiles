# yazi settings, shared by NixOS-WSL (home.nix) and Windows (chezmoi includes this file into
# ~/.config/yazi/yazi.toml). Only what differs from yazi's defaults.
# No theme.toml: the default theme uses the terminal's ANSI colors, so it follows WezTerm's
# color scheme (= rice.yaml's theme) on both sides.

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
linemode = "size"
show_symlink = true
