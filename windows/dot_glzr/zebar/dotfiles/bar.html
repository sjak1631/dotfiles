<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Nerd Font icon classes (nf-*), see https://www.nerdfonts.com/cheat-sheet -->
    <link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
    <link rel="stylesheet" href="./vars.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bar">
      <div class="island left">
        <div id="workspaces" class="workspaces"></div>
        <div id="modes" class="modes"></div>
      </div>
      <div class="island center wide-only">
        <span id="title" class="title"></span>
      </div>
      <div class="island right">
        <span id="media" class="item media clickable wide-only" title="クリックで詳細、中クリックで再生 / 一時停止" hidden></span>
        <span id="cpu" class="item wide-only"></span>
        <span id="memory" class="item wide-only"></span>
        <span id="network" class="item wide-only"></span>
        <span id="volume" class="item clickable" title="クリックで詳細、ホイールで音量、中クリックでミュート" hidden></span>
        <span id="battery" class="item" hidden></span>
        <span id="bluetooth" class="item clickable wide-only" title="Bluetooth"><i class="nf nf-md-bluetooth"></i></span>
        <span id="tray" class="item clickable wide-only" title="トレイ"><i class="nf nf-md-dots_grid"></i></span>
        <span id="date" class="item clock clickable" title="クリックでカレンダー"></span>
        <span id="power" class="item clickable power" title="電源"><i class="nf nf-md-power"></i></span>
      </div>
    </div>
    <script type="module" src="./bar.js"></script>
  </body>
</html>
