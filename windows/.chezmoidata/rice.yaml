# Look & feel shared by GlazeWM, Zebar (and later WezTerm, starship).
# Switch by editing `rice.theme` / `rice.style`, then `chezmoi apply`.
rice:
  theme: gruvbox
  style: floating
  font: JetBrainsMono Nerd Font
  # Bibata Modern cursor size: Regular | Large | Extra-Large (color: `cursors` below)
  cursor_size: Regular
  # WezTerm background opacity (1 = opaque). Plain transparency, no blur: Windows' blurred
  # backdrops (Mica/Acrylic) turn solid whenever the window loses focus
  terminal_opacity: 0.85

# Wallpaper set when the theme changes (falls back to `default`); afterwards, pick from
# ~/Pictures/Wallpapers with "wp" in Flow Launcher. The lock screen follows `landscape`.
# A bare file name refers to ~/Pictures/Wallpapers (images can be dropped there directly, or
# deployed from windows/Pictures/Wallpapers); absolute paths are used as-is.
# Portrait monitors get `portrait` (falls back to `landscape`).
wallpapers:
  default:
    landscape: 'C:\Windows\Web\Wallpaper\Windows\img19.jpg'

# WezTerm built-in color scheme per theme (full 16-color ANSI palettes)
# Mouse cursor per theme: Bibata Modern Amber (yellow) / Classic (black) / Ice (white)
cursors:
  gruvbox: Amber
  catppuccin: Ice
  tokyonight: Ice
  rosepine: Ice
  nord: Ice
  everforest: Amber
  kanagawa: Amber

terminal_schemes:
  gruvbox: GruvboxDark
  catppuccin: Catppuccin Mocha
  tokyonight: Tokyo Night
  rosepine: rose-pine
  nord: nord
  everforest: Everforest Dark (Gogh)
  kanagawa: Kanagawa (Gogh)

# Layout parameters (px, scaled with DPI).
#   bar_margin: space above the bar. Zebar widget height = bar_margin + bar_height
#   corner:     GlazeWM corner style (square | rounded | small_rounded)
styles:
  floating:
    gap: 12
    outer: 12
    bar_height: 32
    bar_margin: 10
    radius: 999
    corner: rounded
  flat:
    gap: 6
    outer: 6
    bar_height: 28
    bar_margin: 0
    radius: 4
    corner: square

